name: Publicar versión

# Al crear una etiqueta vX.Y.Z (o lanzarlo a mano con la versión) se compila el APK firmado con la
# clave de MiBoxOs y se publica como versión de GitHub; la app la encuentra sola
# (Ajustes → Acerca de → Buscar actualización).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar, por ejemplo 0.7.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.MIBOX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret MIBOX_KEYSTORE_BASE64 (ver README → Publicar versiones)"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/miboxos.jks"
      - name: Compilar
        env:
          MIBOX_KEYSTORE_FILE: ${{ runner.temp }}/miboxos.jks
          MIBOX_KEYSTORE_PASSWORD: ${{ secrets.MIBOX_KEYSTORE_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon
      - name: Publicar
        run: |
          TAG="${INPUT_VERSION:+v$INPUT_VERSION}"
          TAG="${TAG:-$GITHUB_REF_NAME}"
          cp app/build/outputs/apk/release/app-release.apk "MiBoxOs-${TAG}.apk"
          gh release create "$TAG" "MiBoxOs-${TAG}.apk" --target "$GITHUB_SHA" --title "MiBoxOs $TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
