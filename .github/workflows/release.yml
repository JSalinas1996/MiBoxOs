name: Publicar versión

# Al crear una etiqueta vX.Y.Z se compila el APK firmado con la clave de MiBoxOs y se publica
# como versión de GitHub; la app la encuentra sola (Ajustes → Acerca de → Buscar actualización).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.MIBOX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret MIBOX_KEYSTORE_BASE64 (ver README → Publicar versiones)"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/miboxos.jks"
      - name: Compilar
        env:
          MIBOX_KEYSTORE_FILE: ${{ runner.temp }}/miboxos.jks
          MIBOX_KEYSTORE_PASSWORD: ${{ secrets.MIBOX_KEYSTORE_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon
      - name: Publicar
        run: |
          cp app/build/outputs/apk/release/app-release.apk "MiBoxOs-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "MiBoxOs-${GITHUB_REF_NAME}.apk" --title "MiBoxOs $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
