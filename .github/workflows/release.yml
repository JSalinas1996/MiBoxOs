name: Publicar versión

# Publica sola cada versión nueva: en cada push, si la versionName de app/build.gradle.kts todavía
# no existe como versión de GitHub, compila el APK firmado con la clave de MiBoxOs, corre los tests
# y la publica. La Mi Box la encuentra en Ajustes → Acerca de → Buscar actualización.
# También se puede lanzar a mano desde la pestaña Actions.
on:
  push:
    branches: ["**"]
    paths: ["app/build.gradle.kts", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: ¿Versión nueva?
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La versión v$VERSION ya está publicada: no hay nada que hacer."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v5
        if: steps.version.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: 17
      - name: Clave de firma
        if: steps.version.outputs.publish == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.MIBOX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MIBOX_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret MIBOX_KEYSTORE_BASE64 (ver README → Actualizaciones y firma)"; exit 1
          fi
          # Tolera saltos de línea o espacios que se cuelan al pegar el secret
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/miboxos.jks" 2>/dev/null; then
            echo "::error::MIBOX_KEYSTORE_BASE64 no es base64 válido: pegá el contenido completo de miboxos-release.jks.base64"; exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/miboxos.jks" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::La clave no abre con MIBOX_KEYSTORE_PASSWORD: revisá que sea el contenido de password.txt (sin espacios)"; exit 1
          fi
      - name: Compilar y testear
        if: steps.version.outputs.publish == 'true'
        env:
          MIBOX_KEYSTORE_FILE: ${{ runner.temp }}/miboxos.jks
          MIBOX_KEYSTORE_PASSWORD: ${{ secrets.MIBOX_KEYSTORE_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon
      - name: Publicar
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "MiBoxOs-${TAG}.apk"
          gh release create "$TAG" "MiBoxOs-${TAG}.apk" --target "$GITHUB_SHA" --title "MiBoxOs $TAG" --generate-notes
          # Resumen con el enlace directo al APK en la página de la corrida
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/MiBoxOs-${TAG}.apk"
          echo "### MiBoxOs $TAG publicada" >> "$GITHUB_STEP_SUMMARY"
          echo "APK: $URL" >> "$GITHUB_STEP_SUMMARY"
