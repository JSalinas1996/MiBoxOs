name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # Si el repo tiene la clave de MiBoxOs en secrets, el APK sale con la firma de siempre
      - name: Clave de firma (opcional)
        env:
          KEYSTORE_BASE64: ${{ secrets.MIBOX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/miboxos.jks"
            echo "MIBOX_KEYSTORE_FILE=$RUNNER_TEMP/miboxos.jks" >> "$GITHUB_ENV"
          fi
      - run: ./gradlew testDebugUnitTest assembleRelease lintRelease --no-daemon
        env:
          MIBOX_KEYSTORE_PASSWORD: ${{ secrets.MIBOX_KEYSTORE_PASSWORD }}
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/
      - uses: actions/upload-artifact@v5
        with:
          name: MiBoxOs-apk
          path: app/build/outputs/apk/release/app-release.apk
